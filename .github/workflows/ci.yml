name: ci

on:
  push:
    branches: [main]
  pull_request:

# Tool versions are pinned; actions are pinned to commit SHAs
# (tags are mutable, SHAs are not).
env:
  TASK_VERSION: "3.53.1"
  GOLANGCI_LINT_VERSION: "v2.13.1"

permissions:
  contents: write # to push the coverage badge to the badges branch

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install golangci-lint
        run: |
          curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/${GOLANGCI_LINT_VERSION}/install.sh" \
            | sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_LINT_VERSION}"

      - name: Check (fmt, vet, lint) and tests with coverage
        run: task fmt:check vet lint cover

      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PCT=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          mkdir -p /tmp/badges
          ./scripts/coverage-badge.sh "$PCT" > /tmp/badges/coverage.svg
          cd /tmp/badges
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add coverage.svg
          git commit -q -m "coverage badge: ${PCT}%"
          # single-commit branch, force-pushed: no history buildup
          git push -qf origin badges
