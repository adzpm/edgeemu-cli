version: "3"

vars:
  BIN_NAME: edgeemu
  BIN: "{{.ROOT_DIR}}/{{.BIN_NAME}}"
  MAIN: "{{.ROOT_DIR}}/cmd/edgeemu"
  GOLANGCI_CONFIG: "{{.ROOT_DIR}}/.golangci.yml"
  GORELEASER_CONFIG: "{{.ROOT_DIR}}/.goreleaser.yaml"
  COVERAGE_FILE: "{{.ROOT_DIR}}/coverage.out"
  DIST_DIR: "{{.ROOT_DIR}}/dist"
  VERSION: { sh: git describe --tags --always --dirty 2>/dev/null || echo dev }
  LDFLAGS: -s -w -X main.version={{.VERSION}}

tasks:
  default:
    deps: [ check ]

  build:
    desc: Build the binary
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BIN}} {{.MAIN}}

  install:
    desc: Install the binary into GOPATH/bin
    cmds:
      - go install -ldflags "{{.LDFLAGS}}" {{.MAIN}}

  run:
    desc: "Run from source (task run -- search sonic)"
    cmds:
      - go run {{.MAIN}} {{.CLI_ARGS}}

  test:
    desc: Run all tests
    cmds:
      - go test -timeout 120s {{.ROOT_DIR}}/...

  cover:
    desc: Run tests with a coverage summary
    cmds:
      - go test -timeout 120s -coverprofile={{.COVERAGE_FILE}} {{.ROOT_DIR}}/...
      - go tool cover -func={{.COVERAGE_FILE}} | tail -1

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run --config {{.GOLANGCI_CONFIG}} {{.ROOT_DIR}}/...

  vet:
    desc: Run go vet
    cmds:
      - go vet {{.ROOT_DIR}}/...

  fmt:
    desc: Format all Go files
    cmds:
      - gofmt -w {{.ROOT_DIR}}

  fmt:check:
    desc: Fail if any file is not gofmt-formatted
    cmds:
      - test -z "$(gofmt -l {{.ROOT_DIR}})"

  tidy:
    desc: Tidy go.mod / go.sum
    dir: "{{.ROOT_DIR}}"
    cmds:
      - go mod tidy

  check:
    desc: "Full local gate: format, vet, lint, tests"
    cmds:
      - task: fmt:check
      - task: vet
      - task: lint
      - task: test

  snapshot:
    desc: Build a local goreleaser snapshot (no publishing)
    cmds:
      - HOMEBREW_TAP_TOKEN=${HOMEBREW_TAP_TOKEN:-snapshot} goreleaser release --config {{.GORELEASER_CONFIG}} --snapshot --clean --skip=publish

  release:check:
    desc: Validate the goreleaser config
    cmds:
      - goreleaser check --config {{.GORELEASER_CONFIG}}

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.DIST_DIR}} {{.BIN}} {{.COVERAGE_FILE}}
