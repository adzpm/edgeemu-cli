version: "3"

vars:
  BIN: edgeemu
  MAIN: ./cmd/edgeemu
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -s -w -X main.version={{.VERSION}}

tasks:
  default:
    deps: [check]

  build:
    desc: Build the binary
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BIN}} {{.MAIN}}

  install:
    desc: Install the binary into GOPATH/bin
    cmds:
      - go install -ldflags "{{.LDFLAGS}}" {{.MAIN}}

  run:
    desc: "Run from source (task run -- search sonic)"
    cmds:
      - go run {{.MAIN}} {{.CLI_ARGS}}

  test:
    desc: Run all tests
    cmds:
      - go test -timeout 120s ./...

  cover:
    desc: Run tests with a coverage summary
    cmds:
      - go test -timeout 120s -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out | tail -1

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format all Go files
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Fail if any file is not gofmt-formatted
    cmds:
      - test -z "$(gofmt -l .)"

  tidy:
    desc: Tidy go.mod / go.sum
    cmds:
      - go mod tidy

  check:
    desc: "Full local gate: format, vet, lint, tests"
    deps: []
    cmds:
      - task: fmt:check
      - task: vet
      - task: lint
      - task: test

  snapshot:
    desc: Build a local goreleaser snapshot (no publishing)
    cmds:
      - HOMEBREW_TAP_TOKEN=${HOMEBREW_TAP_TOKEN:-snapshot} goreleaser release --snapshot --clean --skip=publish

  release:check:
    desc: Validate the goreleaser config
    cmds:
      - goreleaser check

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf dist {{.BIN}} coverage.out
