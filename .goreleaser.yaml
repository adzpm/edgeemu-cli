version: 2

project_name: edgeemu

before:
  hooks:
    - task tidy

builds:
  - id: edgeemu
    main: ./cmd/edgeemu
    binary: edgeemu
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

nfpms:
  - id: packages
    package_name: edgeemu
    homepage: https://github.com/adzpm/edgeemu-cli
    maintainer: adzpm <4c1d4u@gmail.com>
    description: CLI for searching ROMs on edgeemu.net
    license: MIT
    formats:
      - deb
      - rpm

homebrew_casks:
  - name: edgeemu
    repository:
      owner: adzpm
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/adzpm/edgeemu-cli
    description: CLI for searching ROMs on edgeemu.net
    license: MIT
    # The binary is not signed/notarized: strip the quarantine flag so
    # macOS Gatekeeper does not block it after install.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/edgeemu"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: adzpm
    name: edgeemu-cli
